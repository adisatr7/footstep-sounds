name: Test and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for source_file in scripts/*.mjs tests/*.test.mjs; do
            node --check "$source_file"
          done

      - name: Run tests
        run: node --test tests/*.test.mjs

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version tag such as v1.0.0."
            exit 1
          fi
          jq -e --arg version "$VERSION" \
            '.id == "footstep-sounds" and .version == $version' module.json

          MANIFEST="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json"
          DOWNLOAD="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/footstep-sounds.zip"
          mkdir -p dist/scripts dist/lang
          jq --arg manifest "$MANIFEST" --arg download "$DOWNLOAD" \
            '. + {manifest: $manifest, download: $download}' \
            module.json > dist/module.json
          cp scripts/*.mjs dist/scripts/
          cp lang/*.json dist/lang/
          (cd dist && zip -r ../footstep-sounds.zip module.json scripts lang)
          unzip -t footstep-sounds.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/module.json footstep-sounds.zip \
            --verify-tag --title "Footstep Sounds $RELEASE_TAG" --generate-notes
